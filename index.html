  .tg-nat{background:#1e4a2e;color:#57c98b;}
  .tg-shop{background:#1e4a4a;color:#7fe6e6;}

  .rt .a b{color:#fff;}
  .rt .d{color:#ffd166;white-space:nowrap;font-weight:600;}
  .rt small{color:#6f8aac;display:block;}
  .rt .t{color:#57c98b;white-space:nowrap;}

// ============ 投影 & 渲染 ============
const MIN_LNG=96.20, MAX_LNG=97.35, MIN_LAT=31.65, MAX_LAT=33.35;
const SVG_W=1000, SVG_H=1400, PAD_X=70, PAD_Y=80;
function projX(lng){ return PAD_X + (lng-MIN_LNG)/(MAX_LNG-MIN_LNG)*(SVG_W-2*PAD_X); }
function projY(lat){ return PAD_Y + (MAX_LAT-lat)/(MAX_LAT-MIN_LAT)*(SVG_H-2*PAD_Y); }

const catColor = {air:'#ff5959', city:'#ffd166', temple:'#c879ff', nat:'#57c98b', shop:'#19d3d3'};
const catIcon = {air:'✈', city:'▣', temple:'☪', nat:'❀', shop:'kshop'};
const catTag = {air:'机场', city:'城镇', temple:'寺庙/人文', nat:'自然', shop:'特产/非遗'};

const poiById = {};
POIs.forEach(p=>{ poiById[p.id] = {data:p}; });

// 地形背景 - 山脉示意
function renderTerrain(){
  const g = document.getElementById('gTerrain');
  let html = '';
  // 北部山脉(隆宝滩-结古-通天河一带)
  html += '<path d="M 80 180 Q 200 130 320 170 T 600 150 T 920 170 L 920 220 L 80 220 Z" fill="#1e3457" opacity="0.85" stroke="#3a5274" stroke-width="1"/>';
  // 中部山脉(结古-囊谦之间)
  html += '<path d="M 60 600 Q 200 560 360 590 T 700 580 T 940 600 L 940 650 L 60 650 Z" fill="#1e3457" opacity="0.8" stroke="#3a5274" stroke-width="1"/>';
  // 南部山脉(囊谦-达那寺)
  html += '<path d="M 60 1080 Q 200 1040 360 1070 T 700 1060 T 940 1080 L 940 1130 L 60 1130 Z" fill="#1e3457" opacity="0.8" stroke="#3a5274" stroke-width="1"/>';
  // 雪峰符号
  const peaks = [[150,170],[420,160],[680,170],[180,590],[480,585],[780,590],[180,1070],[480,1065]];
  peaks.forEach(([x,y])=>{
    html += `<polygon points="${x-10},${y+10} ${x},${y-14} ${x+10},${y+10}" fill="#3a5274" opacity="0.9"/>`;
    html += `<polygon points="${x-4},${y-3} ${x},${y-14} ${x+4},${y-3}" fill="#cfe0f4" opacity="0.85"/>`;
  });
  g.innerHTML = html;
}

// 河流
function renderRivers(){
  const g = document.getElementById('gRivers');
  let html = '';
  // 通天河(东北部)
  html += `<path d="M 700 100 Q 760 200 820 280 T 920 380" fill="none" stroke="#5aa8df" stroke-width="4" opacity="0.95"/>`;
  html += `<text x="870" y="240" font-size="12" fill="#7fc4ff" font-style="italic" opacity="1" font-weight="600">通天河</text>`;
  // 扎曲河/澜沧江(穿过囊谦南下)
  html += `<path d="M 220 760 Q 240 850 260 920 T 280 1080 T 250 1280" fill="none" stroke="#5aa8df" stroke-width="4" opacity="0.95"/>`;
  html += `<text x="195" y="980" font-size="12" fill="#7fc4ff" font-style="italic" opacity="1" font-weight="600" transform="rotate(80 195 980)">扎曲河·澜沧江</text>`;
  // 吉曲河(达那寺一带)
  html += `<path d="M 200 1180 Q 230 1230 220 1300 T 240 1380" fill="none" stroke="#5aa8df" stroke-width="3" opacity="0.9"/>`;
  html += `<text x="180" y="1330" font-size="11" fill="#7fc4ff" font-style="italic" opacity="1" font-weight="600">吉曲河</text>`;
  g.innerHTML = html;
}

// 驾车路线
function renderRoads(){
  const g = document.getElementById('gRoads');
  let html = '';
  ROADS.forEach(r=>{
    const A=poiById[r.a].data, B=poiById[r.b].data;
    const x1=projX(A.lng), y1=projY(A.lat), x2=projX(B.lng), y2=projY(B.lat);
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const color = r.remote ? '#ff7a7a' : '#5a7a9a';
    const w = r.key ? 2.2 : 1.4;
    const dash = r.remote ? '6 4' : '';
    html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" opacity="0.75" stroke-dasharray="${dash}" class="road-line"/>`;
    // 中点距离/时间标签
    if(r.key){
      html += `<g class="road-label" opacity="0.95">
        <rect x="${(mx-30).toFixed(1)}" y="${(my-12).toFixed(1)}" width="60" height="22" rx="4" fill="rgba(13,22,38,.85)" stroke="#1f3457" stroke-width="0.5"/>
        <text x="${mx.toFixed(1)}" y="${(my-3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#ffd166" font-weight="600">${r.dist} · ${r.time}</text>
        <text x="${mx.toFixed(1)}" y="${(my+5).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="#8aa2bd">${r.road.length>10?r.road.slice(0,9)+'…':r.road}</text>
      </g>`;
    }
  });
  g.innerHTML = html;
}

// 徒步
function renderHikes(){
  const g = document.getElementById('gHikes');
  let html = '';
  HIKES.forEach(h=>{
    const pts = h.pts.map(p=>`${projX(p[1]).toFixed(1)},${projY(p[0]).toFixed(1)}`).join(' ');
    html += `<polyline points="${pts}" fill="none" stroke="#e68a3c" stroke-width="2.2" opacity="0.85" stroke-dasharray="7 5"/>`;
    const mid = h.pts[Math.floor(h.pts.length/2)];
    const mx=projX(mid[1]), my=projY(mid[0]);
    html += `<g class="hike-marker" data-name="${h.name}" data-info="${h.info}" style="cursor:pointer">
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="9" fill="#b8611e" stroke="#fff" stroke-width="1.5"/>
      <text x="${mx.toFixed(1)}" y="${(my+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#fff">🥾</text>
    </g>`;
  });
  g.innerHTML = html;
  // 点击
  g.querySelectorAll('.hike-marker').forEach(el=>{
    el.onclick = ()=>{
      const name = el.getAttribute('data-name');
      const info = el.getAttribute('data-info');
      document.getElementById('detailContent').innerHTML = 
        `<h3 style="color:#e68a3c">🥾 ${name}</h3><div class="tag tg-hike">徒步路线</div><p class="desc">${info}</p>`;
    };
  });
}

// 骑行
function renderBikes(){
  const g = document.getElementById('gBikes');
  let html = '';
  BIKES.forEach(b=>{
    const pts = b.pts.map(p=>`${projX(p[1]).toFixed(1)},${projY(p[0]).toFixed(1)}`).join(' ');
    html += `<polyline points="${pts}" fill="none" stroke="#b07ce6" stroke-width="3" opacity="0.8"/>`;
    const mid = b.pts[Math.floor(b.pts.length/2)];
    const mx=projX(mid[1]), my=projY(mid[0]);
    html += `<g class="bike-marker" data-name="${b.name}" data-info="${b.info}" style="cursor:pointer">
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="9" fill="#5a2c8a" stroke="#fff" stroke-width="1.5"/>
      <text x="${mx.toFixed(1)}" y="${(my+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#fff">🚴</text>
    </g>`;
  });
  g.innerHTML = html;
  g.querySelectorAll('.bike-marker').forEach(el=>{
    el.onclick = ()=>{
      const name = el.getAttribute('data-name');
      const info = el.getAttribute('data-info');
      document.getElementById('detailContent').innerHTML = 
        `<h3 style="color:#b07ce6">🚴 ${name}</h3><div class="tag tg-bike" style="background:#1e3a4a;color:#79c8e6">骑行路线</div><p class="desc">${info}</p>`;
    };
  });
}

// 4日行程动线
function renderDays(){
  const g = document.getElementById('gDays');
  let html = '';
  DAYS.forEach((d,i)=>{
    const key = 'D'+(i+1);
    const c = d.color;
    const pts = d.stops.map(s=>`${projX(s[3]).toFixed(1)},${projY(s[2]).toFixed(1)}`).join(' ');
    html += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="4" opacity="0.85" class="day-route" data-day="${key}"/>`;
    // 序号圆
    d.stops.forEach((s,si)=>{
      const x=projX(s[3]), y=projY(s[2]);
      const isReturn = (si===d.stops.length-1);
      html += `<g class="day-stop" data-day="${key}" data-stop="${s[0]}" data-poi="${s[1]}" data-note="${s[4]}" style="cursor:pointer">
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="${c}" stroke="#fff" stroke-width="2"/>
        <text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#0b1220" font-weight="bold" pointer-events="none">${s[0]}</text>
      </g>`;
    });
    // 中点 📅 总览
    const midIdx = Math.floor(d.stops.length/2);
    const mid = d.stops[midIdx];
    const mx=projX(mid[3]), my=projY(mid[2]);
    html += `<g class="day-info" data-day="${key}" style="cursor:pointer">
      <circle cx="${mx.toFixed(1)}" cy="${(my-20).toFixed(1)}" r="12" fill="${c}" stroke="#fff" stroke-width="1.5"/>
      <text x="${mx.toFixed(1)}" y="${(my-16).toFixed(1)}" text-anchor="middle" font-size="13">📅</text>
      <text x="${mx.toFixed(1)}" y="${(my-34).toFixed(1)}" text-anchor="middle" font-size="9" fill="${c}" font-weight="bold">${key}</text>
    </g>`;
  });
  g.innerHTML = html;
  // 绑定序号点击
  g.querySelectorAll('.day-stop').forEach(el=>{
    el.onclick = ()=>{
      const day = el.getAttribute('data-day');
      const stop = el.getAttribute('data-stop');
      const poiId = el.getAttribute('data-poi');
      const note = el.getAttribute('data-note');
      const d = DAYS[parseInt(day.slice(1))-1];
      const p = poiById[poiId] ? poiById[poiId].data : null;
      const name = p ? p.name : note;
      document.getElementById('detailContent').innerHTML = 
        `<h3 class="detail-title" style="color:${d.color}">${day} 第${stop}站 · ${name}</h3>
         <div class="tag" style="background:${d.color};color:#0b1220">${day} 行程</div>
         <p class="desc">${note}</p>
         ${p ? `<div class="road"><b>📍 景点</b><br>${p.name}<br>海拔 ${p.alt}</div><div class="meta">${p.coord||('约 '+p.lng.toFixed(3)+'°E, '+p.lat.toFixed(3)+'°N')}</div>` : ''}`;
    };
  });
  // 📅 点击
  g.querySelectorAll('.day-info').forEach(el=>{
    el.onclick = ()=>{
      const day = el.getAttribute('data-day');
      const d = DAYS[parseInt(day.slice(1))-1];
      document.getElementById('detailContent').innerHTML = 
        `<h3 class="detail-title" style="color:${d.color}">📅 ${d.name}</h3>
         <p class="desc">${d.info}</p>
         <div class="road" style="border-left:3px solid ${d.color}"><b style="color:${d.color}">🍽️ 推荐美食</b><br><span style="white-space:pre-line">${d.food}</span></div>
         <div class="meta" style="color:#57c98b"><b>🏨 住宿</b><br>${d.stay}</div>`;
    };
  });
}

// 特产店
function renderShops(){
  const g = document.getElementById('gShops');
  let html = '';
  SHOPS.forEach(s=>{
    const x=projX(s.lng), y=projY(s.lat);
    html += `<g class="shop-marker" data-id="${s.id}" style="cursor:pointer">
      <rect x="${(x-9).toFixed(1)}" y="${(y-9).toFixed(1)}" width="18" height="18" rx="3" fill="#19d3d3" stroke="#fff" stroke-width="1.5"/>
      <text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#0b1220" font-weight="bold" pointer-events="none">kshop</text>
      <text x="${x.toFixed(1)}" y="${(y-15).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#7fe6e6" font-weight="600" pointer-events="none" class="poi-label">${s.name.split('(')[0].slice(0,7)}</text>
    </g>`;
  });
  g.innerHTML = html;
  g.querySelectorAll('.shop-marker').forEach(el=>{
    el.onclick = ()=>{ selectShop(el.getAttribute('data-id')); };
  });
}

// 景点
function renderPOIs(){
  const g = document.getElementById('gPois');
  let html = '';
  POIs.forEach((p,idx)=>{
    const x=projX(p.lng), y=projY(p.lat);
    const c = catColor[p.cat];
    const icon = catIcon[p.cat];
    // 标签位置交错避免重叠
    const labelOffsetY = (idx%2===0) ? -16 : 22;
    html += `<g class="poi-marker" data-id="${p.id}" style="cursor:pointer">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${c}" stroke="#fff" stroke-width="1.5"/>
      <text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="10" fill="#0b1220" font-weight="bold" pointer-events="none">${icon}</text>
      <text x="${x.toFixed(1)}" y="${(y+labelOffsetY).toFixed(1)}" text-anchor="middle" font-size="10" fill="#cfe0f4" font-weight="600" pointer-events="none" class="poi-label">${p.name.split('(')[0].slice(0,8)}</text>
    </g>`;
  });
  g.innerHTML = html;
  g.querySelectorAll('.poi-marker').forEach(el=>{
    el.onclick = ()=>{ selectPOI(el.getAttribute('data-id')); };
  });
}

// 选中景点
function selectPOI(id){
  const p = poiById[id].data;
  const tagCls = 'tg-'+p.cat;
  const tagName = catTag[p.cat];
  document.getElementById('detailContent').innerHTML = 
    `<img class="detail-img" src="${p.img}"/>
     <div class="detail-title">${p.name}</div>
     <div><span class="tag ${tagCls}">${tagName}</span><span class="tag tg-hike">海拔 ${p.alt}</span></div>
     <p class="desc">${p.desc}</p>
     <div class="road"><b>🚗 路况/距离</b><br>${p.road}</div>
     <div class="meta">📍 ${p.coord||('约 '+p.lng.toFixed(3)+'°E, '+p.lat.toFixed(3)+'°N  (估算)')}</div>`;
  // 高亮当前标记
  document.querySelectorAll('.poi-marker').forEach(el=>el.style.filter='none');
  const cur = document.querySelector(`.poi-marker[data-id="${id}"]`);
  if(cur) cur.style.filter='drop-shadow(0 0 8px #fff)';
}

// 选中特产店
function selectShop(id){
  const s = SHOPS.find(x=>x.id===id);
  document.getElementById('detailContent').innerHTML = 
    `<h3 class="detail-title" style="color:#7fe6e6">${s.name}</h3>
     <div><span class="tag tg-shop">特产/非遗</span><span class="tag tg-hike">海拔 ${s.alt}</span></div>
     <p class="desc">${s.desc}</p>
     <div class="road"><b>kshop 主营</b><br>${s.goods}</div>
     <div class="meta"><b>地址</b>: ${s.addr}<br>📍 ${s.coord||('约 '+s.lng.toFixed(3)+'°E, '+s.lat.toFixed(3)+'°N')}</div>`;
}

// 侧栏列表
function renderLists(){
  const y=document.getElementById('listYushu'), n=document.getElementById('listNangqian'), s=document.getElementById('listShop');
  y.innerHTML=''; n.innerHTML=''; s.innerHTML='';
  POIs.forEach(p=>{
    const el=document.createElement('div'); el.className='poi';
    el.innerHTML=`<div class="dot c-${p.cat}"></div><img src="${p.img}"><div class="t"><b>${p.name.split('(')[0]}</b><br><span>${p.alt}${p.region==='yushu'?' · 结古':' · 囊谦'}</span></div>`;
    el.onclick=()=>{ selectPOI(p.id); };
    (p.region==='yushu'?y:n).appendChild(el);
  });
  SHOPS.forEach(s2=>{
    const el=document.createElement('div'); el.className='poi';
    el.innerHTML=`<div class="dot c-shop"></div><div class="t"><b>${s2.name.slice(0,12)}</b><br><span>${s2.region==='yushu'?'结古':'囊谦'} · ${s2.goods.split('、')[0]}</span></div>`;
    el.onclick=()=>{ selectShop(s2.id); };
    s.appendChild(el);
  });
}

// 距离列表
function renderDist(){
  const d=document.getElementById('distList'); d.innerHTML='';
  ROADS.forEach(r=>{
    const A=poiById[r.a].data, B=poiById[r.b].data;
    const el=document.createElement('div'); el.className='rt';
    el.innerHTML=`<div class="a"><b>${shortName(A.name)}</b> ↔ <b>${shortName(B.name)}</b>${r.remote?'<small>⚠ 偏远→机场</small>':'<small>'+r.road+'</small>'}</div><div class="d">${r.dist}</div><div class="t">${r.time}</div>`;
    d.appendChild(el);
  });
}
function shortName(s){return s.replace('（','(').split('(')[0].replace('·','·').trim();}

// 图层显示/隐藏
function setLayer(name, visible){
  const map = {poi:'#gPois', shop:'#gShops', road:'#gRoads', hike:'#gHikes', bike:'#gBikes'};
  const sel = map[name];
  if(sel) document.querySelector(sel).style.display = visible?'inline':'none';
}
function setDay(day, visible){
  document.querySelectorAll(`.day-route[data-day="D${day}"], .day-stop[data-day="D${day}"], .day-info[data-day="D${day}"]`).forEach(el=>{
    el.style.display = visible?'inline':'none';
  });
}

// 按钮交互
document.querySelectorAll('.btn[data-layer]').forEach(btn=>{
  btn.onclick = ()=>{
    const layer = btn.getAttribute('data-layer');
    if(layer==='all'){
      // 全显/全隐切换
      const allOn = [...document.querySelectorAll('.btn[data-layer]:not([data-layer="all"])')].every(b=>b.classList.contains('active'));
      document.querySelectorAll('.btn[data-layer]:not([data-layer="all"])').forEach(b=>{
        if(allOn){ b.classList.remove('active'); setLayer(b.getAttribute('data-layer'),false); }
        else { b.classList.add('active'); setLayer(b.getAttribute('data-layer'),true); }
      });
    } else {
      btn.classList.toggle('active');
      setLayer(layer, btn.classList.contains('active'));
    }
  };
});
document.querySelectorAll('.btn[data-day]').forEach(btn=>{
  btn.onclick = ()=>{
    btn.classList.toggle('active');
    setDay(btn.getAttribute('data-day'), btn.classList.contains('active'));
  };
});

// 初始化渲染
renderTerrain();
renderRivers();
renderRoads();
renderHikes();
renderBikes();
renderDays();
renderShops();
renderPOIs();
renderLists();
renderDist();
</script>
</body>
</html>
