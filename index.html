const POIs = [
  {id:'yus', name:'玉树巴塘机场 (YUS)', cat:'air', region:'yushu', lat:32.847, lng:97.078, alt:'3950m',
   img:'images/batang_grassland.jpg',
   desc:'4C级国内支线机场，青海海拔最高、中国第五高高原民用机场(海拔3950m)。跑道3800m，可起降A319等机型。2023年旅客吞吐量36.6万人次，青海支线机场领头羊。通航西宁、西安、成都。',
   road:'北距玉树市中心18km，沿G214国道约30分钟车程；门口有机场巴士(20元/人)到结古镇。'},
  {id:'jiegutown', name:'结古镇(玉树市)', cat:'city', region:'yushu', lat:33.009, lng:97.016, alt:'3700m',

   road:'G214西澜线穿城；往巴塘机场18km，往囊谦170km，往西宁约820km(过玛多/花石峡)。'},
  {id:'jiegu', name:'结古寺', cat:'temple', region:'yushu', lat:33.012, lng:97.016, alt:'3700-3780m',

   road:'位于结古镇内，步行/车程可达；玉树环结古一日精品游核心点之一。',
   coord:'97°00′57″E, 33°00′31″N'},
  {id:'mani', name:'嘉那嘛呢石经城', cat:'temple', region:'yushu', lat:33.020, lng:97.050, alt:'3600m',
   img:'images/mani_stone_city.jpg',
   desc:'位于结古镇东3km新寨村，海拔3600m。由嘉那活佛创建的世界最大嘛呢石堆，刻有六字真言的石块堆砌而成，创吉尼斯世界纪录。正月十五转经朝拜者众多。',
   road:'结古镇出发约3km/10分钟；属"环结古一日精品游"(全程约185km)核心点。',
   coord:'约 97.05°E, 33.02°N (相对定位)'},
  {id:'wencheng', name:'文成公主庙(大日如来佛堂)', cat:'temple', region:'yushu', lat:32.840, lng:97.050, alt:'3700m',
   img:'images/wencheng_temple.jpg',
   desc:'又称大日如来佛堂，结古镇南20km贝纳沟，海拔3700m。唐贞观15年(641年)文成公主进藏时留下的最宏伟遗迹，距今1300余年。依岩崖修建，主佛大日如来高约8m，青海境内最早佛教摩崖大型浮雕群。1957年省级文保。',
   road:'结古镇南20km，G214国道旁转入，约40分钟车程；与巴塘机场同纬度，距机场约8km。',
   coord:'约 97.05°E, 32.84°N'},
  {id:'changu', name:'禅古寺', cat:'temple', region:'yushu', lat:32.970, lng:97.020, alt:'3700m',

   road:'结古南4km；距文成公主庙约16km。'},
  {id:'dangka', name:'当卡寺', cat:'temple', region:'yushu', lat:33.030, lng:97.120, alt:'3600m',

   desc:'位于结古镇东风村扎增大赛山腰，距结古镇约10km，海拔3600m。属嘎玛噶举派寺院。G214国道当卡寺路段(799-800km)易塌方落石，需注意安全。',
   road:'结古镇东约10km；G214 799公里附近。'},
  {id:'tongtian', name:'通天河 · 三江源纪念碑', cat:'nat', region:'yushu', lat:33.050, lng:97.250, alt:'约3600m',
   img:'images/tongtian_river.jpg',
   desc:'三江源自然保护区纪念碑矗立于通天河大桥旁，通天河是长江源区干流。三江(长江、黄河、澜沧江)均发源于玉树境内，故称"三江源"。G214 798公里附近。',

  {id:'leba', name:'勒巴沟岩画(山水嘛呢)', cat:'nat', region:'yushu', lat:32.900, lng:97.100, alt:'约3700m',
   img:'images/leba_gorge.jpg',
   desc:'唐蕃古道遗迹，山体岩壁上刻满古老藏文佛经、六字真言与佛像石刻，"山水嘛呢"独特景观。文成公主庙沿线，徒步可观千年摩崖石刻，经幡漫山。',

   coord:'约 97.10°E, 32.90°N (估算)'},
  {id:'longbao', name:'隆宝滩黑颈鹤自然保护区', cat:'nat', region:'yushu', lat:96.450, lng:33.220, alt:'4100-4200m',

   desc:'国家级自然保护区(1986年)，位于玉树县隆宝镇(结隆乡)，距结古镇西北约80km。平均海拔4200m，面积1万公顷。黑颈鹤(国家一级保护)主要繁殖地，4月底迁徙来此，9月底南飞。每年5-8月可观鹤。',

   coord:'33°09′–33°17′N, 96°24′–96°37′E'},

  {id:'nangqiantown', name:'囊谦县城(香达镇)', cat:'city', region:'nangqian', lat:32.230, lng:96.480, alt:'约3640m',

   desc:'囊谦县府驻地，扎曲河畔。12世纪起统治玉树600年的"囊谦王"部落中心，素有"禅定之乡"美称。寺院多、教派全、宗教氛围浓厚。东经95°21′–97°07′，北纬31°32′–32°43′。',
   road:'结古镇沿G214南行约170km，约3-3.5小时(觉隆尕峡隧道段半幅通行)。',
   coord:'约 96.48°E, 32.23°N'},
  {id:'naijama', name:'乃嘉玛神山', cat:'temple', region:'nangqian', lat:32.200, lng:96.460, alt:'3640m',

   road:'距囊谦县城坐车约15分钟(约10km)；徒步转山2km木栈道<1小时。',
   coord:'约 96.46°E, 32.20°N'},
  {id:'baizha', name:'白扎古盐场', cat:'nat', region:'nangqian', lat:32.100, lng:96.550, alt:'约3700m',

   road:'囊谦县城南G214然娘段岔口转入县道，新建柏油路约10km到达。',
   coord:'约 96.55°E, 32.10°N'},
  {id:'gar', name:'尕尔寺', cat:'temple', region:'nangqian', lat:31.950, lng:96.580, alt:'3700m',

   desc:'位于囊谦县觉拉乡，藏传佛教寺院。囊谦素有"禅定之乡"美称，寺院众多教派齐全，觉拉寺为其中代表，依山而建，金顶红墙，经幡漫山，峡谷森林环抱。',

   road:'囊谦县城—然察峡谷约110km乡道，约4小时；到巴塘机场约280km、7小时(偏远景点)。',

// shop 用方形图标(区别于景点的圆头水滴)
function makeShopIcon(){
  return L.divIcon({className:'', html:'<div class="mk" style="width:24px;height:24px;border-radius:5px;background:#19d3d3;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);font-size:13px">kshop</div>', iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12]});
}

function makeIcon(cat){
  return L.divIcon({className:'', html:'<div class="mk" style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:'+catColor[cat]+';border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.5)"><span style="transform:rotate(45deg);color:#0b1220">'+catIcon[cat]+'</span></div>', iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-26]});
}
function makeIconSpecial(emoji,color){
  return L.divIcon({className:'', html:'<div class="mk" style="width:30px;height:30px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)">'+emoji+'</div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-15]});
}

const poiLayer = L.layerGroup().addTo(map);
const shopLayer = L.layerGroup().addTo(map);
const roadLayer = L.layerGroup().addTo(map);

const day2Layer = L.layerGroup().addTo(map);

const poiById = {};
POIs.forEach(p=>{
  const m = L.marker([p.lat,p.lng],{icon:makeIcon(p.cat)}).addTo(poiLayer);

  // 中线说明
  const midIdx = Math.floor(DAY2.stops.length/2);
  L.marker([DAY2.stops[midIdx][2],DAY2.stops[midIdx][3]],{icon:makeIconSpecial('📅',c)}).addTo(day2Layer).bindPopup('<div class="pp"><h3 style="color:'+c+'">'+DAY2.name+'</h3><p>'+DAY2.info+'</p></div>');
})();

// 侧栏列表
function renderList(){
  const y=document.getElementById('listYushu'), n=document.getElementById('listNangqian');
  y.innerHTML=''; n.innerHTML='';
  POIs.forEach(p=>{
    const el=document.createElement('div'); el.className='poi';
    el.innerHTML='<div class="dot c-'+p.cat+'"></div><img src="'+p.img+'"><div class="t"><b>'+p.name+'</b><br><span>'+p.alt+(p.region==='yushu'?' · 结古片区':' · 囊谦片区')+'</span></div>';
    el.onclick=()=>{ map.flyTo([p.lat,p.lng],11); poiById[p.id].marker.openPopup(); };
    (p.region==='yushu'?y:n).appendChild(el);
  });
}
renderList();

// 特产店铺列表
function renderShopList(){
  const c=document.getElementById('listShop'); c.innerHTML='';
  SHOPS.forEach(s=>{
    const el=document.createElement('div'); el.className='poi';
    el.innerHTML='<div class="dot c-shop"></div><div class="t"><b>'+s.name+'</b><br><span>'+(s.region==='yushu'?'结古':'囊谦')+' · '+(s.goods.split('、')[0])+'</span></div>';
    el.onclick=()=>{ map.flyTo([s.lat,s.lng],13); shopById[s.id].marker.openPopup(); };
    c.appendChild(el);
  });
}
renderShopList();

// 距离列表
function renderDist(){
  const d=document.getElementById('distList'); d.innerHTML='';
  ROADS.forEach(r=>{
    const A=poiById[r.a].data, B=poiById[r.b].data;
    const el=document.createElement('div'); el.className='rt';
    el.innerHTML='<div class="a"><b>'+shortName(A.name)+'</b> ↔ <b>'+shortName(B.name)+'</b>'+(r.remote?'<small>⚠ 偏远→机场</small>':'<small>'+r.road+'</small>')+'</div><div class="d">'+r.dist+'</div><div class="t">'+r.time+'</div>';
    el.onclick=()=>{ map.fitBounds([[A.lat,A.lng],[B.lat,B.lng]],{padding:[80,80]}); };
    d.appendChild(el);
  });
}
function shortName(s){return s.replace('（','(').split('(')[0].replace('·','·').trim();}
renderDist();

// 全图范围
function fitAll(){ map.fitBounds([[31.70,96.25],[33.10,97.30]],{padding:[20,80]}); }
fitAll();

// 按钮交互
function toggle(layer,btn){ if(map.hasLayer(layer)){map.removeLayer(layer);btn.classList.remove('active');} else {map.addLayer(layer);btn.classList.add('active');} }
document.getElementById('tPoi').onclick=function(){toggle(poiLayer,this);};
document.getElementById('tShop').onclick=function(){toggle(shopLayer,this);};
document.getElementById('tRoad').onclick=function(){toggle(roadLayer,this);};
document.getElementById('tHike').onclick=function(){toggle(hikeLayer,this);};
document.getElementById('tBike').onclick=function(){toggle(bikeLayer,this);};
document.getElementById('tDay2').onclick=function(){
  toggle(day2Layer,this);
  if(this.classList.contains('active')){
    map.fitBounds([[32.80,96.95],[33.10,97.30]],{padding:[60,60]});
  }
};
document.getElementById('tFit').onclick=fitAll;
document.getElementById('tSat').onclick=function(){
  if(curBase==='sat'){ map.removeLayer(satLayer); map.removeLayer(refLayer);
    // 切到浅色地形(用Esri terrain)
    const t=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:17}); t.addTo(map); map._topo=t; curBase='topo'; this.textContent='地形图'; }
  else { if(map._topo){map.removeLayer(map._topo);} satLayer.addTo(map); refLayer.addTo(map); curBase='sat'; this.textContent='卫星图'; }
};
</script>
</body>
</html>
